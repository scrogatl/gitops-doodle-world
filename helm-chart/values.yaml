name: doodle-world
replicaCount: 1
labels:
  app.kubernetes.io/name: doodle-world
  app.kubernetes.io/instance: world-xyzz
  app.kubernetes.io/version: "0.9.1"
  app.kubernetes.io/component: service
  app.kubernetes.io/part-of: helloworld
image:
  repository: ghcr.io/scrogatl/doodle-world
  tag: main
  pullPolicy: Always
containerName: doodle-world
env:
- name: PYTHONUNBUFFERED
  value: '1'
ports:
- containerPort: 5002
  name: application
  protocol: TCP
service:
  name: doodle-world
  type: ClusterIP
  ports:
  - name: http
    appProtocol: http
    port: 5002
